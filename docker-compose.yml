services:
  #? PostgreSQL - Para Pedidos
  database:
    image: pgvector/pgvector:pg14
    container_name: mequizap_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mequizap_net

  #? MongoDB - Para Conversas
  mongodb:
    image: mongo:latest
    container_name: mequizap_mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mequizap_net
  
  #? Redis
  redis:
    image: redis:6-alpine
    container_name: mequizap_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mequizap_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 25s
      timeout: 30s
      retries: 5


  #? Evolution API
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: mequizap_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DEBUG: true
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1030657638"
      AUTHENTICATION_API_KEY: ${EVOLUTION_KEY}
      SERVER_URL: http://localhost:8080
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
      CACHE_REDIS_ENABLED: true
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: true
      CACHE_LOCAL_ENABLED: false
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - mequizap_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  #? n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mequizap_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Configurações do N8N
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      
      # Configurações do Banco de Dados
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: host.docker.internal
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Configurações do Redis
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Configurações de Segurança
      N8N_USER_MANAGEMENT_DISABLED: false
      N8N_SECURE_COOKIE: false
      N8N_ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Configurações de logs
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console

    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - mequizap_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  #? Flowise
  flowise:
    image: flowiseai/flowise:latest
    container_name: mequizap_flowise
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      FLOWISE_USERNAME: ${FLOWISE_USER}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}

    volumes:
      - flowise_data:/root/.flowise
    networks:
      - mequizap_net
    depends_on:
      - qdrant

  #? Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mequizap_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mequizap_net

  #? Ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: mequizap_ngrok
    restart: unless-stopped
    command: start --all --config /etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    network_mode: host
    depends_on:
      - evolution_api
      - n8n
      - flowise

volumes:
  postgres_data:
  mongodb_data:
  evolution_data:
  n8n_data:
  flowise_data:
  qdrant_data:

networks:
  mequizap_net:
    driver: bridge